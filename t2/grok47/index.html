<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Geneva Drone Flight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #071018; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 46%, rgba(12, 8, 6, 0.5) 100%);
    }
    #grade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255, 196, 140, 0.10), transparent 28%, transparent 68%, rgba(10, 24, 40, 0.16));
    }
    #card, #lower { position: absolute; color: white; opacity: 0; }
    #card {
      left: 50%; top: 46%; transform: translate(-50%, -50%);
      text-align: center; width: 1400px;
    }
    #lower { left: 78px; bottom: 68px; }
    .rule { width: 78px; height: 2px; background: #f3d7a4; margin: 0 auto 16px; }
    #lower .rule { margin: 0 0 14px; }
    .kicker {
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      letter-spacing: 0.42em; font-size: 16px; color: #f6e6cf;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }
    .title {
      font-family: "Apple SD Gothic Neo", "PingFang SC", sans-serif;
      font-weight: 700; font-size: 76px; letter-spacing: -0.03em;
      line-height: 1.05; margin-top: 6px;
      text-shadow: 0 10px 28px rgba(0,0,0,0.5);
    }
    #card .title { font-size: 108px; }
    .sub {
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-size: 26px; color: #f7f1e6; margin-top: 10px;
      text-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    #card .sub { font-size: 28px; letter-spacing: 0.02em; }
    #telem {
      position: absolute; top: 40px; right: 56px; text-align: right;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 14px; letter-spacing: 0.16em; line-height: 1.7;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    }
    #telem b { color: #ff5a4a; font-weight: 700; }
    #debug {
      position: absolute; left: 24px; top: 18px;
      font: 14px/1.4 Menlo, monospace; color: #ffe08a;
      text-shadow: 0 1px 4px #000;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="grade"></div>
    <div id="vignette"></div>
    <div id="card"></div>
    <div id="lower"></div>
    <div id="telem"></div>
    <div id="debug"></div>
  </div>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
