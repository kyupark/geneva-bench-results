<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENÈVE in BRICKS — Geneva made of LEGO</title>
<style>
  :root { --red:#d01012; --yellow:#ffcf00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2a;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ---------- Title ---------- */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #title.show { opacity: 1; }
  #title .logo { background: var(--red); color: #fff; font-weight: 900; font-size: clamp(36px, 7vw, 96px);
    padding: .15em .45em; border: .08em solid var(--yellow); border-radius: .18em; letter-spacing: .02em;
    box-shadow: 0 .12em 0 #8a0a0b, 0 .25em .5em rgba(0,0,0,.35); transform: rotate(-3deg) scale(.6);
    transition: transform .8s cubic-bezier(.2,1.6,.4,1); }
  #title.show .logo { transform: rotate(-3deg) scale(1); }
  #title .sub { margin-top: 28px; color: #fff; font-size: clamp(16px, 2.2vw, 30px); font-weight: 700;
    letter-spacing: .3em; text-shadow: 0 2px 10px rgba(0,0,0,.5); }

  /* ---------- Landmark card ---------- */
  #card { position: fixed; left: 4vw; bottom: 9vh; pointer-events: none; display: flex; align-items: stretch;
    transform: translateX(-120%); transition: transform .7s cubic-bezier(.2,1.2,.3,1); filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  #card.show { transform: translateX(0); }
  #card .num { background: var(--yellow); color: #222; font-weight: 900; font-size: clamp(28px, 4vw, 54px);
    display: flex; align-items: center; padding: 0 .45em; border-radius: 12px 0 0 12px; position: relative; }
  #card .num::before, #card .num::after { content: ""; position: absolute; top: -9px; width: 22px; height: 9px;
    background: var(--yellow); border-radius: 4px 4px 0 0; }
  #card .num::before { left: 14%; } #card .num::after { right: 14%; }
  #card .body { background: #fff; padding: 14px 26px 16px 22px; border-radius: 0 12px 12px 0; min-width: 300px; }
  #card .ko { font-size: clamp(22px, 2.8vw, 40px); font-weight: 900; color: #1b1b1b; }
  #card .fr { font-size: clamp(13px, 1.3vw, 18px); font-weight: 700; color: var(--red); letter-spacing: .08em; margin-top: 2px; }
  #card .desc { font-size: clamp(12px, 1.15vw, 16px); color: #555; margin-top: 6px; }

  /* ---------- Finale ---------- */
  #finale { position: fixed; top: 7vh; width: 100%; text-align: center; pointer-events: none; opacity: 0;
    transform: translateY(-20px); transition: opacity 1s, transform 1s; color: #fff; text-shadow: 0 3px 14px rgba(0,0,0,.45); }
  #finale.show { opacity: 1; transform: none; }
  #finale h1 { font-size: clamp(30px, 5vw, 72px); font-weight: 900; letter-spacing: .06em; }
  #finale p { font-size: clamp(14px, 1.6vw, 22px); font-weight: 600; margin-top: 8px; letter-spacing: .2em; opacity: .9; }

  /* ---------- Controls ---------- */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 18px 14px; display: flex; gap: 10px; align-items: center;
    background: linear-gradient(transparent, rgba(0,0,0,.45)); opacity: .25; transition: opacity .3s; }
  #ui:hover { opacity: 1; }
  #ui button { background: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 800; cursor: pointer;
    box-shadow: 0 3px 0 #bbb; font-family: inherit; font-size: 13px; }
  #ui button:active { transform: translateY(2px); box-shadow: 0 1px 0 #bbb; }
  #ui button.rec { background: var(--red); color: #fff; box-shadow: 0 3px 0 #8a0a0b; }
  #bar { flex: 1; height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; cursor: pointer; position: relative; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yellow); border-radius: 4px; width: 0; }
  #time { color: #fff; font-size: 12px; font-weight: 700; min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>


<div id="ui">
  <button id="play">❚❚ Pause</button>
  <button id="replay">↺ Restart</button>
  <button id="rec" class="rec">● Save video</button>
  <div id="bar"><i></i></div>
  <div id="time">0.0s</div>
</div>

<script>
/* =========================================================
   GENÈVE in BRICKS — isometric LEGO motion graphic
   ========================================================= */
'use strict';

// ---------- Iso projection constants ----------
const TW = 24, TH = 12, BH = 14, PLATE = 5;   // tile w/h, brick height, baseplate thickness
const GW = 56, GH = 44, GZ = 24;               // world grid size
const proj = (x, y, z) => [(x - y) * TW / 2, (x + y) * TH / 2 - z * BH];

// ---------- Easing ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function easeOutBounce(t) {
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
  return n * (t -= 2.625 / d) * t + .984375;
}

// ---------- Color helpers ----------
function hex2rgb(h) { let s = h.slice(1); if (s.length === 3) s = s.replace(/./g, ch => ch + ch); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(rgb, k) { return `rgb(${rgb[0] * k | 0},${rgb[1] * k | 0},${rgb[2] * k | 0})`; }
const shadeCache = new Map();
function shades(hex) {
  let s = shadeCache.get(hex);
  if (!s) {
    const c = hex2rgb(hex);
    s = { top: shade(c, 1), left: shade(c, .8), right: shade(c, .64), stud: shade(c, .9), studHi: shade(c.map(v => Math.min(255, v * 1.15 + 20)), 1) };
    shadeCache.set(hex, s);
  }
  return s;
}

// Deterministic random
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- LEGO palette ----------
const C = {
  grass: '#4b9f4a', park: '#2f8a45', dkgreen: '#237841', water: '#3a86c8', road: '#a0a5a9', rail: '#6c6e68',
  stone: '#d8c79f', plaza: '#cfc8b8', white: '#f4f4f4', cream: '#efe4c9', tan: '#e4cd9e', dktan: '#958a73',
  red: '#c91a09', dkred: '#8b1c12', yellow: '#f2cd37', orange: '#fe8a18', brown: '#583927', rbrown: '#82422a',
  black: '#2b2b2b', grey: '#a0a5a9', dkgrey: '#6c6e68', copper: '#5f9e7f', slate: '#56646d', bronze: '#4d5a4c',
  window: '#41566b', gold: '#d9a93b', blue: '#0055bf', pink: '#e4a0c0', lime: '#bbe90b', glass: '#cfe8ff'
};

// ---------- Baseplate map ----------
function baseType(x, y) {
  if (x >= 33 && x <= 34 && y >= 18 && y <= 21) return 'road';                  // Pont du Mont-Blanc
  if (x >= 14 && x <= 15 && y >= 18 && y <= 21) return 'road';                  // Pont de la Coulouvrenière
  if ((x >= 36 && y <= 25) || (y >= 18 && y <= 21)) return 'water';             // Lac Léman + Rhône
  if (y >= 42 && x >= 10 && x <= 25) return 'water';                            // Bastions moat
  if (x >= 19 && x <= 22 && y >= 33 && y <= 36) return 'chess';
  if (y >= 3 && y <= 6 && x >= 17 && x <= 35) return 'rail';
  if (y === 14 || y === 22) return 'road';                                      // quais
  if (x === 16 && y >= 7 && y <= 17) return 'road';
  if (x === 10 && y >= 31) return 'road';
  if (x <= 16 && y >= 4 && y <= 12) return 'plaza';                             // Place des Nations
  if (x >= 3 && x <= 14 && y >= 23 && y <= 31) return 'plaza';                  // Place de Neuve
  if (x >= 24 && x <= 34 && y >= 24 && y <= 34) return 'stone';                 // Vieille Ville
  if (x >= 36 && x <= 42 && y >= 26 && y <= 31) return 'park';                  // Jardin Anglais
  if (x >= 11 && x <= 23 && y >= 32 && y <= 41) return 'park';                  // Parc des Bastions
  if (x >= 17 && x <= 35 && y >= 7 && y <= 12) return 'plaza';                  // Cornavin forecourt
  return 'grass';
}
const BASE_COL = { grass: C.grass, park: C.park, water: C.water, road: C.road, rail: C.rail, stone: C.stone, plaza: C.plaza };
const base = [];
for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
  const type = baseType(x, y);
  let col = type === 'chess' ? ((x + y) % 2 ? C.black : C.white) : BASE_COL[type];
  base.push({ x, y, type, col, t: 0 });
}
{ // ripple-in timing from map centre
  const cx = GW / 2, cy = GH / 2;
  for (const b of base) b.t = 0.6 + Math.hypot(b.x - cx, b.y - cy) * 0.055 + rnd() * 0.15;
}

// ---------- Voxel world ----------
const voxels = [];
const occ = new Map();                         // key -> voxel
const key = (x, y, z) => (z * GH + y) * GW + x;
let curGroup = 0;
function add(x, y, z, c, f = {}) {
  if (x < 0 || y < 0 || z < 0 || x >= GW || y >= GH || z >= GZ) return;
  const k = key(x, y, z);
  const old = occ.get(k);
  if (old) { old.c = c; Object.assign(old, f); return; }
  const v = { x, y, z, c, g: curGroup, t: Infinity, ...f };
  occ.set(k, v); voxels.push(v);
}
function box(x0, y0, z0, w, d, h, c, f) {
  for (let z = z0; z < z0 + h; z++) for (let y = y0; y < y0 + d; y++) for (let x = x0; x < x0 + w; x++) add(x, y, z, c, f);
}
function gable(x0, y0, z0, w, d, c, alongX = true) {   // stepped LEGO gable roof
  let i = 0;
  if (alongX) { while (d - 2 * i > 0) { box(x0, y0 + i, z0 + i, w, d - 2 * i, 1, c); i++; } }
  else { while (w - 2 * i > 0) { box(x0 + i, y0, z0 + i, w - 2 * i, d, 1, c); i++; } }
}
function tree(x, y, big = false) {
  box(x, y, 0, 1, 1, big ? 2 : 1, C.rbrown);
  const z = big ? 2 : 1;
  for (let dz = 0; dz < 2; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (dz === 1 && Math.abs(dx) + Math.abs(dy) === 2) continue;
    add(x + dx, y + dy, z + dz, rnd() < .5 ? C.dkgreen : C.grass);
  }
  add(x, y, z + 2, C.grass);
}
function house(x, y, z, w, d, h, wall, roof) {
  box(x, y, z, w, d, h, wall);
  for (let xx = x; xx < x + w; xx++) if ((xx - x) % 2 === 0 && h > 1) add(xx, y + d - 1, z + h - 1, C.window);
  add(x + (w >> 1), y + d - 1, z, C.brown);
  gable(x, y, z + h, w, d, roof, w >= d);
}

/* ---- 01 · Lac Léman & Jet d'Eau ---- */
curGroup = 0;
box(46, 13, 0, 1, 13, 1, C.grey, { ns: 1 });            // Jetée des Eaux-Vives
add(46, 12, 0, C.dkgrey);
for (let z = 1; z <= 16; z++) add(46, 12, z, C.white, { tr: 1, jet: 1, ns: 1 });
box(37, 6, 0, 7, 1, 1, C.grey, { ns: 1 });              // Jetée des Pâquis
box(43, 6, 0, 1, 1, 4, C.white); add(43, 6, 4, C.copper); add(43, 6, 5, C.copper, { ns: 1 });
box(38, 6, 1, 2, 1, 1, C.rbrown);                       // Bains des Pâquis cabins
for (let y = 26; y <= 30; y++) for (let x = 37; x <= 41; x++) {   // Horloge fleurie
  const dx = x - 39, dy = y - 28, r = Math.hypot(dx, dy);
  if (r > 2.3) continue;
  let c = r > 1.5 ? (((x + y) % 2) ? C.red : C.yellow) : C.lime;
  if ((dx === 0 && dy <= 0 && dy >= -1) || (dy === 0 && dx >= 0 && dx <= 1)) c = C.black;
  add(x, y, 0, c, { pl: 1 });
}
tree(35, 16); tree(35, 13); tree(42, 31); tree(36, 31);

/* ---- 02 · Vieille Ville & Cathédrale Saint-Pierre ---- */
curGroup = 1;
box(24, 24, 0, 11, 11, 1, C.dktan);                     // hill
box(25, 25, 1, 9, 9, 1, C.stone);
box(26, 28, 2, 5, 3, 3, C.tan);                         // nave
gable(26, 28, 5, 5, 3, C.slate, true);
box(31, 27, 2, 2, 2, 7, C.cream); box(31, 30, 2, 2, 2, 7, C.cream);  // twin towers
box(31, 27, 9, 2, 2, 1, C.slate); box(31, 30, 9, 2, 2, 1, C.slate);
box(31, 29, 2, 2, 1, 4, C.cream);
for (const y of [27, 29, 31]) box(33, y, 2, 1, 1, 3, C.white);      // neoclassical portico
box(33, 27, 5, 1, 5, 1, C.white); box(33, 28, 6, 1, 3, 1, C.white); add(33, 29, 7, C.white);
for (let z = 5; z <= 10; z++) add(28, 29, z, C.copper);             // green spire
add(28, 29, 11, C.gold, { ns: 1 });
add(32, 27, 10, C.grey); add(32, 27, 11, C.grey);                   // Geneva flag on tower
add(32, 27, 12, C.yellow, { flag: 1 }); add(32, 28, 12, C.red, { flag: 1 });
house(25, 25, 2, 2, 2, 2, C.cream, C.red);
house(28, 25, 2, 3, 2, 3, '#f0c87a', C.dkred);
house(25, 32, 2, 3, 2, 2, '#e9b8a0', C.red);
house(29, 32, 2, 2, 2, 3, C.white, C.dkred);
house(25, 29, 2, 1, 2, 2, '#f0c87a', C.red);
box(34, 24, 1, 1, 1, 2, C.dktan); box(24, 34, 1, 1, 1, 2, C.dktan); // rampart corners

/* ---- 03 · Parc des Bastions & Mur des Réformateurs ---- */
curGroup = 2;
box(11, 41, 0, 14, 1, 4, '#9b9a8e');                    // Reformation Wall
box(11, 41, 4, 14, 1, 1, '#b5b4a8', { ns: 1 });
for (const x of [16, 17, 18, 19]) { add(x, 40, 0, '#7d7c72'); box(x, 40, 1, 1, 1, 3, C.bronze); }
add(12, 40, 0, '#7d7c72'); add(23, 40, 0, '#7d7c72');   // side reliefs
box(12, 40, 1, 1, 1, 2, C.bronze); box(23, 40, 1, 1, 1, 2, C.bronze);
add(19, 34, 0, C.white); add(19, 34, 1, C.white, { ns: 1 });        // giant chess pieces
add(21, 35, 0, C.black); add(21, 35, 1, C.black, { ns: 1 });
add(22, 33, 0, C.black); add(22, 33, 1, C.black); add(22, 33, 2, C.yellow, { ns: 1 });
add(20, 36, 0, C.white); add(20, 36, 1, C.white); add(20, 36, 2, C.white, { ns: 1 });
tree(13, 33, true); tree(17, 33, true); tree(13, 37, true); tree(17, 37, true); tree(23, 38);
box(11, 32, 0, 1, 1, 2, C.black); box(11, 32, 2, 1, 1, 1, C.gold, { ns: 1 });  // park gate

/* ---- 04 · Place de Neuve ---- */
curGroup = 3;
box(4, 24, 0, 5, 5, 4, C.tan);                          // Grand Théâtre
for (let y = 24; y <= 28; y++) { add(9, y, 0, y % 2 ? C.brown : C.cream); if (y % 2 === 0) box(9, y, 1, 1, 1, 2, C.white); }
box(9, 24, 3, 1, 5, 1, C.cream, { ns: 1 });
box(4, 24, 4, 6, 5, 1, C.copper);
box(5, 25, 5, 4, 3, 1, C.copper); box(6, 26, 6, 2, 1, 1, C.copper);
add(9, 24, 5, C.gold, { ns: 1 }); add(9, 28, 5, C.gold, { ns: 1 });
for (let x = 4; x <= 8; x += 2) add(x, 28, 2, C.window);
box(11, 26, 0, 3, 1, 2, '#9b9a8e');                     // Général Dufour statue
box(11, 26, 2, 2, 1, 1, C.bronze); add(13, 26, 3, C.bronze); add(13, 26, 2, C.bronze);
add(11, 26, 3, C.bronze); add(11, 26, 4, C.bronze, { ns: 1 });
box(11, 28, 0, 4, 2, 3, '#e8dfc6');                     // Musée Rath
for (const x of [11, 12, 13, 14]) box(x, 30, 0, 1, 1, 3, C.white);
box(11, 28, 3, 4, 3, 1, C.cream, { ns: 1 }); box(12, 28, 4, 2, 3, 1, C.cream, { ns: 1 });
tree(5, 30);

/* ---- 05 · Gare Cornavin ---- */
curGroup = 4;
box(18, 8, 0, 17, 3, 3, C.cream);
box(23, 8, 0, 7, 4, 4, '#f5ecd6');
for (let x = 18; x <= 34; x++) {
  const front = (x >= 23 && x <= 29) ? 11 : 10;
  for (let z = 1; z <= (front === 11 ? 2 : 2); z++) if (x % 2 === 0) add(x, front, z, C.window);
  if (x % 3 === 0) add(x, front, 0, C.brown);
}
add(26, 11, 3, C.white, { clock: 1 });
box(18, 8, 3, 5, 3, 1, C.dkgrey); box(30, 8, 3, 5, 3, 1, C.dkgrey);
box(23, 8, 4, 7, 4, 1, C.dkgrey);
add(29, 11, 3, C.red, { sbb: 1 });
box(23, 12, 1, 7, 1, 1, C.black, { ns: 1 });            // entrance canopy
for (const x of [23, 29]) add(x, 12, 0, C.grey);
for (const x of [18, 24, 30, 35]) box(x, 5, 0, 1, 1, 2, C.grey);   // platform canopy
box(17, 5, 2, 19, 1, 1, C.dkgrey, { ns: 1 });
tree(19, 13); tree(32, 13);

/* ---- 06 · Palais des Nations (UN) ---- */
curGroup = 5;
box(1, 0, 0, 14, 3, 4, '#efe8d8');
box(5, 0, 0, 6, 3, 5, '#f7f2e6');
for (let x = 1; x <= 14; x++) for (let z = 1; z <= (x >= 5 && x <= 10 ? 4 : 3); z++) if (x % 2) add(x, 2, z, C.window);
for (let x = 5; x <= 10; x++) add(x, 2, 0, C.brown);
const FLAGS = [['#d52b1e', '#fff'], ['#0055bf', '#f2cd37'], ['#009246', '#ce2b37'], ['#000', '#dd0000'], ['#002395', '#ed2939'],
               ['#bc002d', '#fff'], ['#fe8a18', '#169b62'], ['#4b92db', '#fff']];   // last: UN blue
FLAGS.forEach((f, i) => {
  const x = 1 + i * 2;
  box(x, 5, 0, 1, 1, 4, C.grey, { ns: 1 });
  add(x, 5, 4, f[0], { flag: 1, ns: 1 }); add(x + 1, 5, 4, f[1], { flag: 1, ns: 1 });
});
// The Broken Chair (Broken Chair, Daniel Berset)
for (const [x, y] of [[6, 8], [8, 8], [6, 10]]) box(x, y, 0, 1, 1, 4, C.rbrown);
add(8, 10, 0, C.rbrown, { pl: 1 }); add(8, 10, 3, C.rbrown);       // the broken leg
box(6, 8, 4, 3, 3, 1, C.rbrown);
box(6, 8, 5, 3, 1, 4, C.rbrown);
tree(13, 9); tree(2, 10);

/* ---- timeline ---- */
const T_INTRO = 3.6, T_SEG = 5.6, N_SEG = 6;
const T_FINALE = T_INTRO + T_SEG * N_SEG, T_END = T_FINALE + 10;
const SEGMENTS = [
  { ko: 'Lakeside', fr: "LAC LÉMAN · JET D'EAU", desc: "140m high, soaring Jet d’Eau, the Flower Clock and the Pâquis lighthouse", c: [44, 16, 3], z: 1.75 },
  { ko: 'Old Town', fr: 'VIEILLE VILLE · CATHÉDRALE ST-PIERRE', desc: 'The Old Town on the hill and St. Pierre Cathedral’s green spire', c: [29, 29, 4], z: 2.2 },
  { ko: 'Bastions', fr: 'PARC DES BASTIONS', desc: 'A park with the Reformation Wall and a giant chessboard', c: [17, 37, 2], z: 2.2 },
  { ko: 'Place de Neuve', fr: 'PLACE DE NEUVE', desc: 'Grand Théâtre, Musée Rath, General Dufour statue', c: [9, 27, 2], z: 2.3 },
  { ko: 'Central Station', fr: 'GARE CORNAVIN', desc: 'Geneva’s gateway, Cornavin Station and red SBB trains', c: [26, 8, 2], z: 2.0 },
  { ko: 'UN', fr: 'PALAIS DES NATIONS', desc: 'The Allée des Drapeaux and the Broken Chair', c: [8, 5, 3], z: 2.1 },
];
// assign landing times: layer by layer, with a little randomness
for (let g = 0; g < N_SEG; g++) {
  const vs = voxels.filter(v => v.g === g);
  const zmax = Math.max(...vs.map(v => v.z)) || 1;
  const s = T_INTRO + g * T_SEG + 0.9, D = 3.4;
  for (const v of vs) v.t = s + (v.z / zmax) * D * 0.75 + rnd() * D * 0.25;
}
// static draw order (back to front)
voxels.sort((a, b) => (a.x + a.y + a.z) - (b.x + b.y + b.z) || a.z - b.z || (a.x - b.x));

// =========================================================
//  RENDERING
// =========================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

// ---------- Camera ----------
const MAP_BOUNDS = (() => {
  const xs = [proj(0, GH, 0)[0], proj(GW, 0, 0)[0]];
  const ys = [proj(0, 0, 12)[1], proj(GW, GH, 0)[1] + PLATE];
  return { cx: (xs[0] + xs[1]) / 2, cy: (ys[0] + ys[1]) / 2, w: xs[1] - xs[0], h: ys[1] - ys[0] };
})();
const fitZoom = () => Math.min(W / MAP_BOUNDS.w, H / MAP_BOUNDS.h) * 0.94;
function camFor(i, drift = 0) {          // i = -1 → full view
  if (i < 0) return { x: MAP_BOUNDS.cx, y: MAP_BOUNDS.cy, z: fitZoom() * (1 + drift * 0.06) };
  const s = SEGMENTS[i], p = proj(...s.c);

  for (let i = 0; i < N_SEG; i++) {
    const x = W - 36 * S - (N_SEG - 1 - i) * 26 * S, y = 36 * S;
    ctx.fillStyle = i < g ? C.yellow : i === g ? C.red : 'rgba(255,255,255,.55)';
    rrect(x - 9 * S, y - 9 * S, 18 * S, 18 * S, 4 * S); ctx.fill();
  }
  ctx.restore();
}
function drawFinale(t) {
  const a = clamp((t - T_FINALE - 2.0) / 1.0);
  if (a <= 0) return;
  const S = Math.min(W, H) / 820;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16; ctx.fillStyle = '#fff';
  ctx.font = `900 ${58 * S}px ${FONT}`; ctx.fillText('GENÈVE · Geneva', W / 2, 92 * S + (1 - a) * -20);
  ctx.font = `700 ${16 * S}px ${FONT}`; ctx.globalAlpha = a * 0.9;
  ctx.fillText('B U I L T   B R I C K   B Y   B R I C K', W / 2, 126 * S);
  ctx.shadowColor = 'transparent';
  // landmark chips
  ctx.font = `800 ${15 * S}px ${FONT}`;
  const names = SEGMENTS.map(s => s.ko), pad = 16 * S, gap = 10 * S;
  const ws = names.map(n => ctx.measureText(n).width + pad * 2);
  let x = W / 2 - (ws.reduce((p, c) => p + c, 0) + gap * (names.length - 1)) / 2;
  names.forEach((n, i) => {
    const ki = easeOutBack(clamp((t - T_FINALE - 2.6 - i * 0.15) / 0.5));
    if (ki <= 0) { x += ws[i] + gap; return; }
    const y = H - 70 * S + (1 - ki) * 30 * S;
    ctx.globalAlpha = a * clamp(ki);
    ctx.fillStyle = [C.red, C.yellow, '#2f8a45', C.blue, C.orange, '#4b92db'][i];
    rrect(x, y, ws[i], 34 * S, 8 * S); ctx.fill();
    ctx.fillStyle = i === 1 ? '#222' : '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(n, x + ws[i] / 2, y + 17 * S + 1);
    x += ws[i] + gap;
  });
  ctx.restore();
}

// =========================================================
//  MAIN LOOP & CONTROLS
// =========================================================
let T = 0, playing = true, last = performance.now(), recorder = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) T += dt;
  if (T > T_END) {
    if (recorder) { recorder.stop(); recorder = null; T = T_END; playing = false; }
    else if (T > T_END + 2) T = 0;
  }
  render(Math.min(T, T_END));
  bar.style.width = (Math.min(T, T_END) / T_END * 100) + '%';
  timeEl.textContent = `${Math.min(T, T_END).toFixed(1)} / ${T_END.toFixed(0)}s`;
  requestAnimationFrame(frame);
}
function render(t) {
  const dusk = clamp((t - T_FINALE - 1) / 7) * 0.8;
  const cam = camAt(t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t, dusk, cam);
  // world transform
  ctx.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (W / 2 - cam.x * cam.z), DPR * (H / 2 - cam.y * cam.z));
  VIEW = { l: cam.x - W / 2 / cam.z, r: cam.x + W / 2 / cam.z, t: cam.y - H / 2 / cam.z, b: cam.y + H / 2 / cam.z };
  // soft shadow under the baseplate
  const pa = clamp((t - 0.5) / 1.5);
  if (pa > 0) {
    ctx.fillStyle = `rgba(10,30,60,${0.25 * pa})`;
    const [x0, y0] = proj(0, 0, 0), [x1, y1] = proj(GW, 0, 0), [x2, y2] = proj(GW, GH, 0), [x3, y3] = proj(0, GH, 0);
    ctx.beginPath(); ctx.moveTo(x0, y0 + 26); ctx.lineTo(x1 + 10, y1 + 26); ctx.lineTo(x2, y2 + 30); ctx.lineTo(x3 - 10, y3 + 26); ctx.closePath(); ctx.fill();
  }
  drawBase(t);
  drawWorld(t);
  drawSpray(t);
  drawGulls(t);
  // screen-space grading
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (dusk > 0) {
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = `rgba(255,120,40,${dusk * 0.55})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,30,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawTitle(t);
  drawCard(t);
  drawFinale(t);
}

// ---------- Controls ----------
const bar = document.querySelector('#bar i'), timeEl = document.getElementById('time');
const playBtn = document.getElementById('play');
function setPlaying(p) { playing = p; playBtn.textContent = p ? '❚❚ Pause' : '▶ Play'; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('replay').onclick = () => { T = 0; setPlaying(true); };
document.getElementById('bar').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * T_END;
};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') T = Math.min(T_END, T + 2);
  if (e.code === 'ArrowLeft') T = Math.max(0, T - 2);
  if (e.key === 'r') { T = 0; setPlaying(true); }
});
document.getElementById('rec').onclick = () => {
  if (recorder || !window.MediaRecorder) return;
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const mimeType = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const chunks = [];
  recorder = new MediaRecorder(cv.captureStream(60), { mimeType, videoBitsPerSecond: 16e6 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'geneve-lego.' + (mimeType.includes('mp4') ? 'mp4' : 'webm'); a.click();
    document.getElementById('rec').textContent = '● Save video';
  };
  T = 0; setPlaying(true); recorder.start();
  document.getElementById('rec').textContent = '■ Recording…';
};
requestAnimationFrame(frame);
</script>
</body>
